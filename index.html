<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=privacy-policy.html" />
  <title>HURO Policies</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 24px;
    }
    main {
      width: 100%;
      max-width: 560px;
      background: white;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      border: 1px solid #e2e8f0;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
    }
    p {
      color: #475569;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .links {
      display: grid;
      gap: 12px;
    }
    a {
      display: inline-block;
      padding: 14px 18px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      border: 1px solid #cbd5e1;
      color: #1C74E9;
      background: #eff6ff;
    }
    a.primary {
      background: #1C74E9;
      color: white;
      border-color: #1C74E9;
    }
  </style>
</head>
<body>
  <main>
    <h1>HURO Policies</h1>
    <p>If you are not redirected automatically, use one of the links below.</p>
    <div class="links">
      <a class="primary" href="privacy-policy.html">Privacy Policy</a>
      <a href="delete-account.html">Delete Account</a>
    </div>
  </main>
</body>
</html>
